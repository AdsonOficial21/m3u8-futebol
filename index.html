<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adson Tech Sat | Player</title>
<style>
  :root { --bg:#08080b; --card:#111116; --card2:#17171e; --line:#24242e; --gold:#d4af37; --gold2:#f5d87a; --txt:#f2f2f4; --mut:#8b8b98; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--txt);
               font-family:system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { overflow-x:hidden; }

  /* tela de canais (feita para TV: textos grandes, foco bem visível) */
  #home { min-height:100%; padding:calc(4vh + env(safe-area-inset-top, 0px)) 5vw 5vh;
          background:radial-gradient(1200px 500px at 50% -10%, #1b1608 0%, var(--bg) 60%); }
  .brand { text-align:center; font-size:clamp(28px, 4vw, 52px); font-weight:800; letter-spacing:2px;
           background:linear-gradient(90deg,var(--gold),var(--gold2)); -webkit-background-clip:text;
           background-clip:text; color:transparent; margin-bottom:6px; }
  .sub { text-align:center; color:var(--mut); font-size:clamp(14px, 1.6vw, 22px); margin-bottom:4vh; }
  #lista { max-width:1400px; margin:0 auto; display:grid; gap:20px;
           grid-template-columns:repeat(auto-fill, minmax(clamp(200px, 22vw, 320px), 1fr)); }
  .canal { display:block; text-decoration:none; padding:clamp(20px, 3.5vw, 44px) 18px; border-radius:16px; border:3px solid var(--line);
           background:var(--card); color:var(--txt); font-size:clamp(16px, 1.9vw, 28px); font-weight:600;
           cursor:pointer; text-align:center; transition:transform .12s, border-color .12s, background .12s; }
  .canal::before { content:'▶'; display:block; color:var(--gold); font-size:1.1em; margin-bottom:10px; }
  .canal:hover, .canal:focus { border-color:var(--gold); background:#221d0b; transform:scale(1.06);
                               box-shadow:0 0 0 4px rgba(212,175,55,.35); outline:none; }
  #msg { text-align:center; color:var(--mut); padding:40px 10px; font-size:clamp(16px, 1.8vw, 24px); }
</style>
</head>
<body>

<main id="home">
  <div class="brand">ADSON TECH</div>
  <div class="sub">Use as setas do controle e aperte OK para assistir</div>
  <div id="msg">Carregando canais...</div>
  <div id="lista"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCz2n_9x7pkSsuV6S6iWuvLxecdLF3wD-8",
  authDomain: "m3u8-futebol.firebaseapp.com",
  databaseURL: "https://m3u8-futebol-default-rtdb.firebaseio.com",
  projectId: "m3u8-futebol",
  storageBucket: "m3u8-futebol.firebasestorage.app",
  messagingSenderId: "613537989895",
  appId: "1:613537989895:web:fab5b1683c81ccae75b1a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const listaEl = document.getElementById('lista');
const msg = document.getElementById('msg');

let embeds = [];
let focoId = null;      // último canal em foco na lista
try { focoId = sessionStorage.getItem('focoId'); } catch {}   // lembra o canal ao voltar da página dele

/* ---------- foco na lista ---------- */
function cards() { return Array.from(listaEl.querySelectorAll('.canal')); }

function focarCanal(id) {
  const todos = cards();
  const alvo = todos.find(b => b.dataset.id === id) || todos[0];
  if (alvo) { alvo.focus(); alvo.scrollIntoView({ block:'center' }); }
}

function mover(dir) {
  const todos = cards();
  if (!todos.length) return;
  const atual = todos.includes(document.activeElement) ? document.activeElement : null;
  if (!atual) { todos[0].focus(); return; }

  const a = atual.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let melhor = null, melhorScore = Infinity;

  todos.forEach(b => {
    if (b === atual) return;
    const r = b.getBoundingClientRect();
    const dx = (r.left + r.width / 2) - ax;
    const dy = (r.top + r.height / 2) - ay;
    let principal, lateral;
    if (dir === 'right')      { if (dx <= 5)  return; principal = dx;  lateral = Math.abs(dy); }
    else if (dir === 'left')  { if (dx >= -5) return; principal = -dx; lateral = Math.abs(dy); }
    else if (dir === 'down')  { if (dy <= 5)  return; principal = dy;  lateral = Math.abs(dx); }
    else                      { if (dy >= -5) return; principal = -dy; lateral = Math.abs(dx); }
    const score = principal + lateral * 3;
    if (score < melhorScore) { melhorScore = score; melhor = b; }
  });

  if (melhor) {
    melhor.focus();
    focoId = melhor.dataset.id;
    melhor.scrollIntoView({ block:'center' });
  }
}

// setas movem o foco (OK/Enter abre o link do canal em foco)
document.addEventListener('keydown', e => {
  const mapa = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  const dir = mapa[e.key];
  if (dir) { e.preventDefault(); mover(dir); }
});

/* ---------- lista de canais (Firebase) ---------- */
function desenhar() {
  const tinhaFoco = listaEl.contains(document.activeElement);
  listaEl.innerHTML = '';
  embeds.forEach(e => {
    const a = document.createElement('a');
    a.className = 'canal';
    a.dataset.id = e.id;
    a.href = e.url;               // vai direto para o link do canal
    a.textContent = e.nome;
    a.onfocus = () => { focoId = e.id; };
    a.onclick = () => { try { sessionStorage.setItem('focoId', e.id); } catch {} };
    listaEl.appendChild(a);
  });
  if (tinhaFoco || !document.activeElement || document.activeElement === document.body) focarCanal(focoId);
}

db.ref('embeds').on('value', snap => {
  const dados = snap.val() || {};
  embeds = Object.entries(dados)
    .map(([id, c]) => ({ id, nome: c.nome || 'Canal', url: c.url, criadoEm: c.criadoEm || 0 }))
    .filter(e => /^https?:\/\//i.test(e.url || ''))
    .sort((a, b) => a.criadoEm - b.criadoEm);

  msg.style.display = embeds.length ? 'none' : '';
  if (!embeds.length) msg.textContent = 'Nenhum canal cadastrado ainda.';
  desenhar();
}, err => { msg.style.display = ''; msg.textContent = 'Erro ao carregar: ' + err.message; });
</script>
</body>
</html>
