<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adson Tech Sat | Player</title>
<style>
  :root { --bg:#08080b; --card:#111116; --card2:#17171e; --line:#24242e; --gold:#d4af37; --gold2:#f5d87a; --txt:#f2f2f4; --mut:#8b8b98; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--txt);
               font-family:system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { overflow-x:hidden; }

  /* tela de canais (feita para TV: textos grandes, foco bem visível) */
  #home { min-height:100%; padding:calc(4vh + env(safe-area-inset-top, 0px)) 5vw 5vh;
          background:radial-gradient(1200px 500px at 50% -10%, #1b1608 0%, var(--bg) 60%); }
  .brand { text-align:center; font-size:clamp(28px, 4vw, 52px); font-weight:800; letter-spacing:2px;
           background:linear-gradient(90deg,var(--gold),var(--gold2)); -webkit-background-clip:text;
           background-clip:text; color:transparent; margin-bottom:6px; }
  .sub { text-align:center; color:var(--mut); font-size:clamp(14px, 1.6vw, 22px); margin-bottom:4vh; }
  #lista { max-width:1400px; margin:0 auto; display:grid; gap:20px;
           grid-template-columns:repeat(auto-fill, minmax(clamp(200px, 22vw, 320px), 1fr)); }
  .canal { padding:clamp(20px, 3.5vw, 44px) 18px; border-radius:16px; border:3px solid var(--line);
           background:var(--card); color:var(--txt); font-size:clamp(16px, 1.9vw, 28px); font-weight:600;
           cursor:pointer; text-align:center; transition:transform .12s, border-color .12s, background .12s; }
  .canal::before { content:'▶'; display:block; color:var(--gold); font-size:1.1em; margin-bottom:10px; }
  .canal:hover, .canal:focus { border-color:var(--gold); background:#221d0b; transform:scale(1.06);
                               box-shadow:0 0 0 4px rgba(212,175,55,.35); outline:none; }
  #msg { text-align:center; color:var(--mut); padding:40px 10px; font-size:clamp(16px, 1.8vw, 24px); }

  /* tela do player */
  #player { position:fixed; inset:0; z-index:10; background:#000; display:none; }
  #player.ativo { display:block; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  #voltar { position:absolute; top:calc(10px + env(safe-area-inset-top, 0px)); left:10px; z-index:20;
            padding:12px 20px; border-radius:999px; border:2px solid rgba(255,255,255,.3);
            background:rgba(0,0,0,.6); color:#fff; font-size:clamp(14px, 1.5vw, 20px); font-weight:600; cursor:pointer;
            opacity:.4; transition:opacity .2s; }
  #voltar:hover, #voltar:focus { opacity:1; border-color:var(--gold); background:var(--gold); color:#000;
                                 box-shadow:0 0 0 4px rgba(212,175,55,.4); outline:none; }
</style>
</head>
<body>

<main id="home">
  <div class="brand">ADSON TECH SAT</div>
  <div class="sub">Use as setas do controle e aperte OK para assistir</div>
  <div id="msg">Carregando canais...</div>
  <div id="lista"></div>
</main>

<section id="player">
  <button id="voltar">← Canais</button>
  <iframe id="tela"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="no"></iframe>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCz2n_9x7pkSsuV6S6iWuvLxecdLF3wD-8",
  authDomain: "m3u8-futebol.firebaseapp.com",
  databaseURL: "https://m3u8-futebol-default-rtdb.firebaseio.com",
  projectId: "m3u8-futebol",
  storageBucket: "m3u8-futebol.firebasestorage.app",
  messagingSenderId: "613537989895",
  appId: "1:613537989895:web:fab5b1683c81ccae75b1a2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const home = document.getElementById('home');
const listaEl = document.getElementById('lista');
const msg = document.getElementById('msg');
const player = document.getElementById('player');
const tela = document.getElementById('tela');
const voltarBtn = document.getElementById('voltar');

let embeds = [];
let atualId = null;     // canal aberto (null = está na lista)
let focoId = null;      // último canal em foco na lista

/* ---------- abrir / fechar canal ---------- */
function abrir(item) {
  atualId = item.id;
  focoId = item.id;
  tela.src = item.url;
  player.classList.add('ativo');
  home.style.display = 'none';
  try { history.pushState({ player: 1 }, ''); } catch {}   // botão Voltar da TV fecha o canal
  voltarBtn.focus();
}

function fechar() {
  atualId = null;
  tela.removeAttribute('src');   // para o vídeo
  player.classList.remove('ativo');
  home.style.display = '';
  focarCanal(focoId);
}

function voltar() {
  if (history.state && history.state.player) history.back();   // dispara o popstate
  else if (atualId) fechar();
}
window.addEventListener('popstate', () => { if (atualId) fechar(); });

/* Mantém o foco do controle no botão Voltar enquanto o canal está aberto.
   Se o foco cair dentro do player (clique no volume, por exemplo), o botão o recupera
   logo depois, para as setas e o OK voltarem a funcionar. */
function devolverFoco(atraso) {
  setTimeout(() => { if (atualId && document.activeElement !== voltarBtn) voltarBtn.focus(); }, atraso);
}
tela.addEventListener('load', () => { if (atualId) devolverFoco(300); });
window.addEventListener('blur', () => { if (atualId && document.activeElement === tela) devolverFoco(1500); });
voltarBtn.onclick = voltar;

/* ---------- foco na lista ---------- */
function cards() { return Array.from(listaEl.querySelectorAll('.canal')); }

function focarCanal(id) {
  const todos = cards();
  const alvo = todos.find(b => b.dataset.id === id) || todos[0];
  if (alvo) { alvo.focus(); alvo.scrollIntoView({ block:'center' }); }
}

function mover(dir) {
  const todos = cards();
  if (!todos.length) return;
  const atual = todos.includes(document.activeElement) ? document.activeElement : null;
  if (!atual) { todos[0].focus(); return; }

  const a = atual.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let melhor = null, melhorScore = Infinity;

  todos.forEach(b => {
    if (b === atual) return;
    const r = b.getBoundingClientRect();
    const dx = (r.left + r.width / 2) - ax;
    const dy = (r.top + r.height / 2) - ay;
    let principal, lateral;
    if (dir === 'right')      { if (dx <= 5)  return; principal = dx;  lateral = Math.abs(dy); }
    else if (dir === 'left')  { if (dx >= -5) return; principal = -dx; lateral = Math.abs(dy); }
    else if (dir === 'down')  { if (dy <= 5)  return; principal = dy;  lateral = Math.abs(dx); }
    else                      { if (dy >= -5) return; principal = -dy; lateral = Math.abs(dx); }
    const score = principal + lateral * 3;
    if (score < melhorScore) { melhorScore = score; melhor = b; }
  });

  if (melhor) {
    melhor.focus();
    focoId = melhor.dataset.id;
    melhor.scrollIntoView({ block:'center' });
  }
}

const TECLAS_VOLTAR = new Set(['Escape', 'Backspace', 'BrowserBack', 'GoBack']);
const CODIGOS_VOLTAR = new Set([4, 27, 8, 10009, 461]);   // Android TV, Esc, Backspace, Tizen, webOS

document.addEventListener('keydown', e => {
  // dentro do canal: botão Voltar do controle fecha
  if (atualId) {
    if (TECLAS_VOLTAR.has(e.key) || CODIGOS_VOLTAR.has(e.keyCode)) { e.preventDefault(); voltar(); return; }
    // qualquer seta leva o foco até o botão Voltar; OK (Enter) nele fecha o canal
    if (e.key.startsWith('Arrow') && document.activeElement !== voltarBtn) { e.preventDefault(); voltarBtn.focus(); }
    return;
  }
  // na lista: setas movem o foco (OK/Enter clica no botão em foco)
  const mapa = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  const dir = mapa[e.key];
  if (dir) { e.preventDefault(); mover(dir); }
});

/* ---------- lista de canais (Firebase) ---------- */
function desenhar() {
  const tinhaFoco = listaEl.contains(document.activeElement);
  listaEl.innerHTML = '';
  embeds.forEach(e => {
    const b = document.createElement('button');
    b.className = 'canal';
    b.dataset.id = e.id;
    b.textContent = e.nome;
    b.onfocus = () => { focoId = e.id; };
    b.onclick = () => abrir(e);
    listaEl.appendChild(b);
  });
  if (!atualId && (tinhaFoco || !document.activeElement || document.activeElement === document.body)) focarCanal(focoId);
}

db.ref('embeds').on('value', snap => {
  const dados = snap.val() || {};
  embeds = Object.entries(dados)
    .map(([id, c]) => ({ id, nome: c.nome || 'Canal', url: c.url, criadoEm: c.criadoEm || 0 }))
    .filter(e => /^https:\/\//i.test(e.url || ''))
    .sort((a, b) => a.criadoEm - b.criadoEm);

  if (atualId && !embeds.some(e => e.id === atualId)) voltar();

  msg.style.display = embeds.length ? 'none' : '';
  if (!embeds.length) msg.textContent = 'Nenhum canal cadastrado ainda.';
  desenhar();
}, err => { msg.style.display = ''; msg.textContent = 'Erro ao carregar: ' + err.message; });
</script>
</body>
</html>
